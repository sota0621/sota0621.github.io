<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sota's Portfolio</title>
    <style>
        /* 全体のリセットとベースデザイン */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans JP', sans-serif;
        }

        body {
            background-color: #ffffff; /* 清潔感のある白 */
            color: #1e293b; /* 読みやすい濃いグレー */
            line-height: 1.7;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* ヘッダー：かっちりしたナビゲーション */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 30px;
            border-bottom: 2px solid #0f172a; /* 太めの黒に近いラインで引き締める */
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #0f172a;
        }

        .header-sub {
            font-size: 0.85rem;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* メインビジュアル：文字と自画像を横並びにするレイアウト */
        .hero {
            padding: 100px 0 80px 0;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 40px;
        }

        .hero-text {
            flex: 1;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: #0f172a;
            line-height: 1.3;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        .hero p {
            font-size: 1.1rem;
            color: #475569;
            max-width: 640px;
        }

        /* 自画像イメージのエリア設定 */
        .hero-image {
            flex-shrink: 0;
        }

        .hero-image img {
            width: 160px;  /* 画像の横幅 */
            height: 160px; /* 画像の縦幅 */
            object-fit: cover;
            border-radius: 4px; /* 全体のかっちり感に合わせて丸みを最小限に */
            border: 1px solid #cbd5e1;
            background-color: #f8fafc; /* 万が一画像が読み込めない時の背景 */
        }

        /* セクション共通設定 */
        section {
            padding: 80px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
        }

        /* 見出しの横にスタイリッシュな細い線を入れる */
        section h2::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: #cbd5e1;
            margin-left: 20px;
        }

        /* 自己紹介エリア */
        .profile-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .profile-text {
            font-size: 1.05rem;
            color: #334155;
        }

        .profile-text p {
            margin-bottom: 20px;
        }

        /* フッター */
        footer {
            text-align: center;
            padding: 60px 0 20px 0;
            color: #94a3b8;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* スマホ対応：画面が狭いときは縦並びにする */
        @media (max-width: 620px) {
            .hero {
                flex-direction: column-reverse; /* スマホでは画像を上、文字を下に配置 */
                text-align: center;
                padding: 60px 0;
                gap: 24px;
            }
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            section { padding: 60px 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">KABEYA SOTA</div>
            <div class="header-sub">PORTFOLIO</div>
        </header>

        <div class="hero">
            <div class="hero-text">
                <h1>Sota's Digital Space</h1>
                <p>壁谷宗汰の個人ウェブサイトです。</p>
            </div>
            <div class="hero-image">
                <img src="画像/kabeya.jpg" alt="壁谷宗汰の自画像">
            </div>
        </div>

        <section id="about">
            <h2>自己紹介</h2>
            <div class="profile-layout">
                <div class="profile-text">
                    <p>はじめまして、壁谷宗汰（かべやそうた）と申します。当サイトをご覧いただきありがとうございます。</p>
                    <p>現在はAI技術の基礎を学びながら、自身のクリエイティブな関心を表現するための土台作りを行っています。</p>
                    <p>現在はまだ明確な実績はありませんが、この場所を自らの成長ログ、および今後の制作物を格納するポートフォリオとして、丁寧かつ着実に更新を重ねていく予定です。</p>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Sota0621. All Rights Reserved.</p>
        </footer>
    </div>

</body>
</html>
